<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Your Abstract — Project Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a href="index.html" class="back-link">&larr; Project Developers</a>
    <p class="masthead-kicker">Call for Papers</p>
    <h1 class="masthead-title">Submit Your Abstract</h1>
    <p class="masthead-sub">Send us your details and your abstract. We'll confirm receipt by email.</p>
  </div>
</header>

<main class="content">
  <form id="submission-form" novalidate>

    <div class="field-row">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div class="field">
        <label for="category">Category / domain</label>
        <input type="text" id="category" name="category" placeholder="e.g. Computer Science" required>
      </div>
    </div>

    <div class="field">
      <label for="title">Paper title</label>
      <input type="text" id="title" name="title" required>
    </div>

    <div class="field">
      <label for="message">Message <span class="optional">(optional)</span></label>
      <textarea id="message" name="message" rows="4"></textarea>
    </div>

    <div class="field">
      <label for="file">Abstract / reference file</label>
      <div class="file-drop" id="file-drop">
        <input type="file" id="file" name="file" accept=".pdf,.doc,.docx" required>
        <p class="file-drop-text" id="file-drop-text">Choose a file or drop it here — PDF or Word, up to 10 MB</p>
      </div>
    </div>

    <button type="submit" id="submit-btn" class="submit-btn">Submit abstract</button>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<footer class="site-footer">
  <p>Questions before you submit? Reach us on WhatsApp.</p>
</footer>

<a
  id="whatsapp-btn"
  class="whatsapp-fab"
  href="https://wa.me/916374761203?text=Hi%2C%20I%20have%20a%20question%20about%20submitting%20my%20abstract."
  target="_blank"
  rel="noopener noreferrer"
  aria-label="Message us on WhatsApp"
>

<script src="script.js"></script>
</body>
</html>
